name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - name: Bash syntax
        run: bash -n install.sh awgproxy.sh lib/*.sh
      - name: ShellCheck
        run: shellcheck --severity=error install.sh awgproxy.sh lib/*.sh
      - name: Unit tests
        run: bats tests
